[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openfilings"
version = "0.22.0"
description = "Search, parse, and normalize public filings across global markets."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = [
  "filings",
  "xbrl",
  "ifrs",
  "esef",
  "financial-statements",
  "regulatory-filings",
  "sec-alternative",
  "mcp",
  "equity-research",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Financial and Insurance Industry",
  "Intended Audience :: Developers",
  "Topic :: Office/Business :: Financial :: Investment",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
  "Typing :: Typed",
]
dependencies = [
  "finvariant>=0.1,<0.2",
  "httpx>=0.28,<1",
  "markdownify>=1.2,<2",
  "mcp>=1.27,<3",
  "pydantic>=2.10,<3",
  "pymupdf4llm>=1.28,<2",
  "rapidfuzz>=3.9,<4",
  "typer>=0.15,<1",
]

[project.urls]
Homepage = "https://github.com/ryanrodrigues25200525-svg/openfilings"
Repository = "https://github.com/ryanrodrigues25200525-svg/openfilings"
Issues = "https://github.com/ryanrodrigues25200525-svg/openfilings/issues"
Changelog = "https://github.com/ryanrodrigues25200525-svg/openfilings/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dataframe = ["pandas>=2.2,<4"]
pdf-detect = ["pdf-inspector>=0.2,<0.3"]

[project.scripts]
openfilings = "openfilings.cli:app"
openfilings-smoke = "openfilings.smoke:main"

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<2",
  "ruff>=0.12,<1",
]

[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = ["work"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.hatch.build.targets.wheel]
packages = ["src/openfilings"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]
