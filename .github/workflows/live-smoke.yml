name: Keyless live smoke tests

on:
  schedule:
    - cron: "41 4 * * 3"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keyless-live-smoke
  cancel-in-progress: false

jobs:
  smoke:
    name: Public regulator contracts
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.30"
          python-version: "3.13"
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked --all-extras
      - name: Run keyless regulator checks
        env:
          OPENFILINGS_DATA_DIR: ${{ runner.temp }}/openfilings-smoke
        run: uv run python -m openfilings.smoke
      - name: Run reviewed source-accuracy benchmarks
        env:
          OPENFILINGS_DATA_DIR: ${{ runner.temp }}/openfilings-benchmarks
        run: uv run python -m openfilings.benchmarks
